name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests-floor:
    name: Tests (oldest supported HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # HA 2025.3 pins deps (orjson, pydantic-core, ciso8601) that have no
          # 3.14 wheels, so the floor can only be exercised on 3.13.
          python-version: "3.13"
      # `hacs.json`'s `homeassistant` key is a promise made to strangers
      # installing this, so it is tested rather than asserted. 0.13.222 pins
      # Home Assistant 2025.3.1, the oldest release carrying every API the
      # integration imports: `helpers.service_info.zeroconf` arrived in 2025.2
      # and `AddConfigEntryEntitiesCallback` in 2025.3, and on 2025.2.5 the
      # import fails outright. Raise this pin and `hacs.json` together.
      - run: pip install "pytest-homeassistant-custom-component==0.13.222"
      # The test harness at that pin has no `components.diagnostics` helper,
      # which `tests/test_diagnostics.py` imports. That is the rig missing a
      # module on an old release, not the integration needing a newer Home
      # Assistant -- `diagnostics.py` itself imports nothing that old HA lacks.
      - run: pytest --ignore=tests/test_diagnostics.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.8.3 requires >=3.14.2; an older runner cannot
          # even install it.
          python-version: "3.14"
      - run: pip install -r requirements_dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --strict custom_components/alertroster
      - name: mypy (tests)
        # Not --strict: the point is to catch fixture-signature drift and wrong
        # annotations in the suite. It earned its place immediately -- it found
        # `events()` typed as an AsyncIterator, which has no `aclose()`, while
        # its own docstring tells callers to wrap it in `aclosing()`.
        run: mypy tests
      - name: pytest
        run: pytest
